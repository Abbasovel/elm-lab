name: Android — Sürət Analizatoru

on:
  push:
    branches: [main]
    paths:
      - "android-surat/**"
      - "surat/index.html"
      - ".github/workflows/android-surat.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Veb hissəni tətbiqə köçür (tək mənbə — surat/index.html)
        run: |
          mkdir -p android-surat/app/src/main/assets
          cp surat/index.html android-surat/app/src/main/assets/index.html

      - name: APK qur
        working-directory: android-surat
        run: gradle --no-daemon assembleRelease

      - name: APK-nı adlandır
        run: cp android-surat/app/build/outputs/apk/release/app-release.apk "SuretAnalizatoru-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SuretAnalizatoru-apk
          path: SuretAnalizatoru-*.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surat-v1.0.${{ github.run_number }}
          name: Sürət Analizatoru 1.0.${{ github.run_number }}
          body: |
            Android tətbiqi (AutoProject). Telefonda APK faylını açıb quraşdırın.
            Yeni versiya köhnənin üstünə silmədən quraşdırılır.
          files: SuretAnalizatoru-*.apk
          make_latest: true
