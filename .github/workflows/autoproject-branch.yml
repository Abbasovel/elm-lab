name: autoproject.az üçün yayım budağı

# surat/index.html dəyişəndə onu "autoproject-suret" budağına (yalnız bu fayl) köçürür.
# Hostinger hPanel → Advanced → Git bu budağı public_html/suret qovluğuna yerləşdirir.
on:
  push:
    branches: [main]
    paths: ["surat/index.html", ".github/workflows/autoproject-branch.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Budağı yenilə
        run: |
          mkdir /tmp/out && cp surat/index.html /tmp/out/index.html
          cd /tmp/out
          git init -q -b autoproject-suret
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html
          git commit -q -m "Sürət Analizatoru — ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" autoproject-suret
